[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intertreeseg"
version = "0.1.0"
description = "Interactive (click-guided) tree instance segmentation on Point Transformer V3"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "InterTreeSeg contributors" }]
keywords = ["point-cloud", "instance-segmentation", "forestry", "lidar", "point-transformer"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# NOTE: torch / spconv / flash_attn / torch_scatter are CUDA-build specific and are
# intentionally NOT hard pins here (they come from the provider's index or the
# reference Docker image). See requirements.txt for the tested versions.
dependencies = [
    "numpy",
    "pandas",
    "h5py>=3.11",
    "plyfile",
    "PyYAML>=6.0",
    "tqdm",
    "addict>=2.4.0",
    "timm>=1.0.9",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Extras that pull heavy / environment-specific backends.
prep = ["hilbertcurve"]   # only tools/prepare_data.py needs this
viz = ["open3d>=0.18"]

[project.scripts]
intertreeseg-train = "tools.train:main"
intertreeseg-test = "tools.test_h5:main"
intertreeseg-infer = "tools.infer_scene:main"
intertreeseg-prepare = "tools.prepare_data:main"
intertreeseg-eval = "tools.evaluate:main"

[tool.setuptools.packages.find]
include = ["intertreeseg*"]
